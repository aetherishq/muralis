# CI : build + tests unitaires sur chaque PR et chaque push sur main (issue #51).
# Windows obligatoire : l'app et ses tests ciblent net10.0-windows (WPF).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Muralis.slnx --configuration Release
