# Release : construit l'installeur sur tag v* (ou manuellement via workflow_dispatch
# pour tester sans publier). Build vérifiable exigé par SignPath — la signature des
# binaires sera insérée entre l'upload d'artefact et la Release (cf. .claude/plan-signpath.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Garde-fou : le tag doit correspondre à la version déclarée dans le script
      # d'installeur, sinon l'exe produit ne porterait pas le bon nom/numéro.
      - name: Check tag matches installer version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $iss = Get-Content installer\Muralis.iss -Raw
          if ($iss -notmatch '#define\s+MyAppVersion\s+"([^"]+)"') {
            Write-Error "MyAppVersion introuvable dans installer\Muralis.iss"
            exit 1
          }
          $version = $Matches[1]
          if ($version -ne $tag) {
            Write-Error ("Le tag v$tag ne correspond pas a MyAppVersion=$version " +
              "(installer\Muralis.iss). Bumpe MyAppVersion et <Version> dans " +
              "src\Muralis\Muralis.csproj, recommite, puis retague.")
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Muralis-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.exe
